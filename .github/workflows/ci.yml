name: Tests and security checks

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Check Python syntax
        run: python -m compileall -q agents kaplan_meier.py cli.py enrichment.py simulator.py
      - name: Run Python tests
        run: python -m pytest -q
      - name: Test browser application
        run: |
          node --check web/app.js
          node --test web/test-app.cjs
      - name: Verify CLI entry point
        run: kaplan-meier analyze --time 1 2 3 --event 1 0 1 --json
